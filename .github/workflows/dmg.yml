name: image-discoque-macos

# L'image n'est construite qu'à la demande (workflow_dispatch) ou lors d'un tag
# `v1.2.3`, qui la joint à la version publiée. La construction exige macOS :
# `hdiutil` n'existe pas ailleurs.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version inscrite dans l'image (laisser vide pour celle du dépôt)"
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dmg:
    # HFS+ reste lisible par toutes les versions de macOS, y compris anciennes.
    # macos-14 est en cours de retrait par GitHub ; macos-15 reste compatible.
    runs-on: macos-15
    env:
      CRIM_HEBDO_CONFIG_JSON: ${{ secrets.CRIM_HEBDO_CONFIG_JSON }}
      DEVELOPER_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_CERTIFICATE_BASE64 }}
      DEVELOPER_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # `git describe` a besoin des tags

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la suite de tests
        run: python3 -m unittest discover -s tests

      - name: Installer dmgbuild
        run: python3 -m pip install --disable-pip-version-check dmgbuild==1.6.7

      - name: Préparer la configuration embarquée (clés PISTE)
        shell: bash
        run: |
          set -euo pipefail
          # Le secret contient le JSON complet (source piste + client_id +
          # client_secret). Écrit hors du dépôt, il n'est jamais committé ; on
          # ne l'affiche pas (masqué par GitHub de toute façon).
          if [[ -n "${CRIM_HEBDO_CONFIG_JSON:-}" ]]; then
            printf '%s' "$CRIM_HEBDO_CONFIG_JSON" > "$RUNNER_TEMP/config.json"
            echo "config.json embarqué : oui (source piste)"
          else
            echo "config.json embarqué : NON — l'app utilisera la source DILA (sans clé)"
          fi

      - name: Valider la configuration embarquée
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/config.json" ]]; then
            python3 tools/validate_config.py "$RUNNER_TEMP/config.json"
          else
            echo "Aucun config embarqué : l'app utilisera DILA (sans clé). C'est autorisé."
          fi

      - name: Construire l'image
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ARGS=()
          if [[ -n "$VERSION" ]]; then ARGS+=(--version "$VERSION"); fi
          if [[ -f "$RUNNER_TEMP/config.json" ]]; then
            ARGS+=(--config-json "$RUNNER_TEMP/config.json")
          fi
          # ${ARGS[@]+...} : un tableau vide lève « unbound variable » avec
          # `set -u` sur l'ancien bash (macOS). Cette forme tolère le vide.
          python3 tools/build_dmg.py ${ARGS[@]+"${ARGS[@]}"}

      - name: Signer et notarier l'image (si les identifiants sont configurés)
        id: notarize
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DEVELOPER_CERTIFICATE_BASE64" ]]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            # Pas de certificat Apple : on produit quand même l'image, non
            # signée. macOS demandera une autorisation manuelle au premier
            # lancement (ouvrir quand même). On n'échoue plus sur un tag, pour
            # ne pas bloquer la publication d'une image utilisable.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::warning::Image non signée (aucun certificat Developer ID configuré) : Gatekeeper demandera une autorisation manuelle."
            else
              echo "Secrets Apple absents : image non signée (artefact de développement uniquement)."
            fi
            exit 0
          fi
          for name in DEVELOPER_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Secret requis manquant : $name" >&2
              exit 1
            fi
          done

          KEYCHAIN="$RUNNER_TEMP/crim-hebdo-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE="$RUNNER_TEMP/developer-id.p12"
          echo "$DEVELOPER_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$DEVELOPER_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F '"' '/Developer ID Application:/ { print $2; exit }')"
          if [[ -z "$IDENTITY" ]]; then
            echo "Aucune identité Developer ID Application valide dans le certificat." >&2
            exit 1
          fi

          DMG=(dist/*.dmg)
          codesign --force --sign "$IDENTITY" --timestamp --identifier "fr.crimhebo.distribution" "${DMG[0]}"
          codesign --verify --verbose=2 "${DMG[0]}"
          xcrun notarytool submit "${DMG[0]}" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "${DMG[0]}"
          xcrun stapler validate "${DMG[0]}"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Contrôler le fichier produit
        run: |
          ls -la dist/*.dmg
          shasum -a 256 dist/*.dmg | tee dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: veille-criminelle-dmg
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Joindre l'image à la version
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS
